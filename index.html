<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum İzni Hesaplama</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; font-size: 20px; color: #111; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        select, input {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover { background: #333; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.8;
        }
        .result b { color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Doğum İzni Hesaplama</h2>
    
    <div class="form-group">
        <label for="kanun">Çalışma Statüsü</label>
        <select id="kanun">
            <option value="657">657 Memur</option>
            <option value="4857">4857 İşçi</option>
        </select>
    </div>

    <div class="form-group">
        <label for="gebelikTipi">Gebelik Durumu</label>
        <select id="gebelikTipi">
            <option value="tekil">Tekil Gebelik</option>
            <option value="cogul">Çoğul Gebelik</option>
        </select>
    </div>

    <div class="form-group">
        <label for="doktorRaporu">Çalışabilir Raporu Durumu</label>
        <select id="doktorRaporu">
            <option value="yok">Normal İzin (Çalışmayacak)</option>
            <option value="var">Çalışabilir Raporu Alındı (5 Hafta Aktarım)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="tahminiDogumTarihi">Tahmini Doğum Tarihi</label>
        <input type="date" id="tahminiDogumTarihi">
    </div>

    <button onclick="hesapla()">HESAPLA</button>

    <div id="sonucAlani" class="result" style="display:none;"></div>
</div>

<script>
document.getElementById('tahminiDogumTarihi').valueAsDate = new Date();

function hesapla() {
    const gebelikTipi = document.getElementById('gebelikTipi').value;
    const doktorRaporu = document.getElementById('doktorRaporu').value;
    const tarihStr = document.getElementById('tahminiDogumTarihi').value;

    if (!tarihStr) {
        alert("Lütfen doğum tarihi seçiniz.");
        return;
    }

    let dogumDate = new Date(tarihStr);

    let temelOncesiHafta = (gebelikTipi === 'cogul') ? 10 : 8;
    let temelSonrasiHafta = 8;
    
    let dogumOncesiGun = temelOncesiHafta * 7;
    let calisilanGun = (doktorRaporu === 'var') ? ((gebelikTipi === 'cogul') ? 14 : 35) : 0;

    let kullanilacakDogumOncesiGun = dogumOncesiGun - calisilanGun;
    let toplamDogumSonrasiGun = (temelSonrasiHafta * 7) + calisilanGun;

    let izinBitisDate = new Date(dogumDate);
    izinBitisDate.setDate(dogumDate.getDate() + toplamDogumSonrasiGun);

    const sonucDiv = document.getElementById('sonucAlani');
    sonucDiv.style.display = 'block';
    sonucDiv.innerHTML = `
        • Doğum Öncesi İzin: <b>${kullanilacakDogumOncesiGun} gün</b> (${Math.floor(kullanilacakDogumOncesiGun/7)} hafta)<br>
        • Doğum Sonrası İzin: <b>${toplamDogumSonrasiGun} gün</b> (${Math.floor(toplamDogumSonrasiGun/7)} hafta)<br>
        • İzin Bitiş Tarihi: <b>${formatTarih(izinBitisDate)}</b>
    `;
}

function formatTarih(date) {
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return ${day}.${month}.${year};
}
</script>

</body>
</html>
